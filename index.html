<style>
/* ===== 基本 ===== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
.emoji,.wx,.pt-emoji,.h-i,.now-wx,.d-i,.r-emoji,.m-emoji,.chip,.sun,h1 .sun{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-variant-emoji:emoji}
.emoji{line-height:1;vertical-align:-.1em}
.badge .emoji,.metrics .emoji,.h-pop .emoji,.h-mm .emoji{margin-right:2px}
:root{
  --bg:#eef4fb; --bg2:#f7fbff; --card:#fff; --ink:#182a3d; --muted:#6b7c8f; --line:#e3ebf3;
  --accent:#2f7fd0; --ink-btn:#16283c;
}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{
  background:linear-gradient(180deg,var(--bg) 0%,var(--bg2) 46%,#fbfdff 100%);
  min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  font-size:15px; line-height:1.45;
}
body.locked{overflow:hidden}
button{font-family:inherit;color:inherit}
h1,h2,h3,p{margin:0}

/* ===== ヘッダー ===== */
header{
  position:sticky; top:0; z-index:30;
  padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
  background:linear-gradient(180deg,rgba(238,244,251,.97) 0%,rgba(238,244,251,.88) 100%);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(227,235,243,.85);
}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
h1 .sun{font-size:16px}
.hd-right{display:flex;align-items:center;gap:8px}
#updated{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.icon-btn{
  width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;
  font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 2px rgba(16,42,67,.06);cursor:pointer;padding:0;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.pills{display:flex;gap:6px;margin-top:9px}
.pill{
  flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#42566b;
  border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:background .15s,color .15s;
}
.pill .cnt{font-size:10.5px;font-weight:700;opacity:.62;font-variant-numeric:tabular-nums}
.pill[aria-selected="true"]{background:var(--ink-btn);border-color:var(--ink-btn);color:#fff}
.pill[aria-selected="true"] .cnt{opacity:.75}

/* ===== 一覧 ===== */
main{padding:10px 12px calc(78px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.list{display:flex;flex-direction:column;gap:8px}
.banner{
  margin:0 0 9px;padding:9px 11px;border-radius:12px;font-size:12px;line-height:1.5;
  background:#fff5e6;border:1px solid #ffe0b8;color:#8a5200;display:flex;align-items:center;gap:8px;
}
.banner button{margin-left:auto;flex:0 0 auto;border:1px solid #f0c98a;background:#fff;border-radius:9px;padding:5px 9px;font-size:11.5px;font-weight:700;color:#8a5200;cursor:pointer}
.empty{padding:34px 12px;text-align:center;color:var(--muted);font-size:13px}
.foot{margin:14px 4px 0;text-align:center;font-size:10.5px;color:#91a1b3}

/* ===== 地点カード ===== */
.card{
  background:var(--card);border:1px solid rgba(227,235,243,.95);border-radius:16px;
  padding:9px 11px 10px;cursor:pointer;
  box-shadow:0 1px 2px rgba(16,42,67,.05),0 7px 18px -12px rgba(16,42,67,.35);
  transition:transform .12s ease, box-shadow .12s ease;
  position:relative;
}
.card:active{transform:scale(.994);box-shadow:0 1px 2px rgba(16,42,67,.05),0 4px 12px -10px rgba(16,42,67,.3)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card.is-home::before{
  content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;
  background:linear-gradient(180deg,#57b0e8,#2f7fd0);
}
.card-top{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center}
.pt-emoji{
  width:34px;height:34px;border-radius:11px;background:#f1f6fc;display:flex;align-items:center;justify-content:center;
  font-size:18px;line-height:1;
}
.pt-name{min-width:0}
.nm{display:block;font-size:14.5px;font-weight:750;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-now{display:flex;align-items:center;gap:5px}
.wx{font-size:21px;line-height:1}
.tmp{font-size:25px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tmp.cold{color:#2f6fb3}.tmp.cool{color:#2b7ea8}.tmp.mild{color:#182a3d}.tmp.warm{color:#d2762a}.tmp.hot{color:#c0392b}

.metrics{display:flex;align-items:center;gap:11px;margin-top:6px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;flex-wrap:nowrap}
.metrics b{color:var(--ink);font-weight:650}
.metrics .m-wind b.hi{color:#b3261e}

.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.badge{font-size:11px;font-weight:750;padding:2.5px 8px;border-radius:8px;line-height:1.35;white-space:nowrap}
.badge.rain{background:#e8f1fd;color:#1f5fa8}
.badge.wind{background:#fde9e7;color:#b3261e;border:1px solid #f7c9c4}
.badge.wind.mid{background:#fff3e0;color:#a35c00;border:1px solid #ffe0b0}
.badge.walk{background:#fff2e0;color:#96550a}
.badge.bike{background:#e8f7ee;color:#1b7a43}

.skel{height:96px;border-radius:16px;background:linear-gradient(100deg,#f4f8fc 30%,#eaf1f8 50%,#f4f8fc 70%);background-size:200% 100%;animation:shim 1.2s infinite}
@keyframes shim{to{background-position:-200% 0}}

/* ===== 下部バー ===== */
.bottombar{
  position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;gap:8px;align-items:center;
  padding:8px 12px calc(9px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(251,253,255,0) 0%,rgba(244,249,254,.94) 38%,rgba(244,249,254,.99) 100%);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:640px;margin:0 auto;
}
.btn-add{
  flex:1;height:45px;border-radius:14px;border:0;background:var(--ink-btn);color:#fff;
  font-size:14.5px;font-weight:750;cursor:pointer;box-shadow:0 6px 16px -8px rgba(16,42,67,.7);
}
.btn-add:active{transform:scale(.99)}
.btn-manage{
  width:54px;height:45px;border-radius:14px;border:1px solid var(--line);background:#fff;font-size:17px;
  cursor:pointer;box-shadow:0 2px 6px -3px rgba(16,42,67,.3);
}

/* ===== シート共通 ==== */
.overlay{
  position:fixed;inset:0;background:rgba(12,26,40,.42);z-index:60;opacity:0;pointer-events:none;
  transition:opacity .2s ease;
}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:70;background:#fff;
  border-radius:22px 22px 0 0;max-height:90vh;display:flex;flex-direction:column;
  transform:translateY(103%);transition:transform .26s cubic-bezier(.22,.72,.2,1);
  box-shadow:0 -8px 30px -12px rgba(12,26,40,.45);
  padding-bottom:env(safe-area-inset-bottom);
}
.sheet.open{transform:translateY(0)}
.grab{flex:0 0 auto;padding:9px 0 3px;display:flex;justify-content:center}
.grab::after{content:"";width:38px;height:4px;border-radius:2px;background:#d9e3ee}
.sheet-head{
  flex:0 0 auto;display:flex;align-items:flex-start;gap:10px;padding:6px 16px 10px;
  border-bottom:1px solid var(--line);
}
.sh-title{display:flex;align-items:center;gap:9px;min-width:0;flex:1}
.sh-title .ico{width:34px;height:34px;border-radius:11px;background:#f1f6fc;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
.sh-name{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-sub{font-size:11px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.close{
  width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:#f7fafd;
  font-size:13px;color:#4d6275;cursor:pointer;flex:0 0 auto;padding:0;
}
.sheet-body{overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}

/* ===== 詳細シート ===== */
.now-box{display:flex;align-items:center;gap:14px;padding:2px 0 10px}
.now-wx{font-size:44px;line-height:1}
.now-main{flex:1;min-width:0}
.now-temp{font-size:36px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.now-temp span{font-size:19px;font-weight:700;margin-left:1px}
.now-label{font-size:13px;font-weight:700;color:#42566b;margin-top:3px}
.now-meta{font-size:11.5px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
.sec-title{font-size:12px;font-weight:800;color:#42566b;letter-spacing:.04em;margin:12px 0 6px;display:flex;align-items:center;gap:6px}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line)}

.h-w .u{font-size:9px;opacity:.75;margin-left:1px}
.hours{display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hour{
  flex:0 0 61px;text-align:center;background:#f6fafe;border:1px solid var(--line);border-radius:11px;
  padding:7px 3px 6px;font-variant-numeric:tabular-nums;
}
.hour.now{background:#eaf3ff;border-color:#bcd8f5}
.h-t{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.02em}
.hour.now .h-t{color:#1f5fa8}
.h-i{font-size:18px;line-height:1.5}
.h-temp{font-size:13.5px;font-weight:800}
.h-pop{font-size:10px;color:#1f5fa8;margin-top:1px}
.h-mm{font-size:10px;color:#2b7ea8}
.h-w{font-size:10px;color:var(--muted);margin-top:1px}
.h-w.hi{color:#b3261e;font-weight:800}

.days{display:flex;flex-direction:column}
.day{display:grid;grid-template-columns:46px 25px 1fr auto;gap:9px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:12px}
.day:first-child{border-top:0}
.d-l{font-size:11.5px;font-weight:800;color:#42566b;line-height:1.2}
.d-l span{display:block;font-size:10px;font-weight:600;color:var(--muted)}
.d-i{font-size:18px;text-align:center}
.d-t{min-width:0}
.d-t b{display:block;font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-t>span{display:block;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-t>span i{font-style:normal}
.d-g{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.d-g b{font-size:13.5px;font-weight:800}
.d-g span{font-size:11.5px;color:var(--muted);margin-left:4px}
.d-badges{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}

/* ===== 並び替えシート ===== */
.mrow{padding:9px 0;border-top:1px solid var(--line)}
.mrow:first-child{border-top:0}
.m-top{display:flex;align-items:center;gap:9px}
.m-emoji{width:30px;height:30px;border-radius:10px;background:#f1f6fc;display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 auto}
.m-name{flex:1;min-width:0;font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m-name span{display:block;font-size:10.5px;font-weight:500;color:var(--muted);margin-top:1px}
.m-btns{display:flex;gap:4px;flex:0 0 auto}
.m-btns button{
  width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#f8fbfe;font-size:11px;
  color:#3d5164;cursor:pointer;padding:0;line-height:1;
}
.m-btns button[data-act="del"]{color:#b3261e;border-color:#f3d3cf;background:#fdf5f4}
.m-btns button:disabled{opacity:.32}
.m-cat{display:flex;gap:5px;margin:7px 0 0 39px}
.m-cat button{
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 10px;font-size:10.5px;font-weight:700;
  color:#5a6e82;cursor:pointer;
}
.m-cat button.on{background:#eaf3ff;border-color:#b7d6f4;color:#1f5fa8}
.mrow-top{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.btn-reset{
  width:100%;height:42px;border-radius:12px;border:1px solid #f0cdc8;background:#fff;color:#a8281f;
  font-size:13px;font-weight:750;cursor:pointer;margin-top:14px;
}
.hint{font-size:11px;color:var(--muted);line-height:1.6;margin-top:12px;background:#f6fafe;border:1px solid var(--line);border-radius:11px;padding:9px 11px}
.hint b{color:#42566b}
.ver{text-align:center;font-size:10px;color:#9fb0c2;margin-top:12px;font-variant-numeric:tabular-nums}

/* ===== 追加シート ===== */
.addcat{display:flex;gap:5px;background:#f1f6fc;border:1px solid var(--line);border-radius:11px;padding:3px;margin-bottom:10px}
.addcat button{flex:1;border:0;background:transparent;border-radius:9px;padding:7px 0;font-size:12.5px;font-weight:700;color:#5a6e82;cursor:pointer}
.addcat button.on{background:#fff;color:#182a3d;box-shadow:0 1px 3px rgba(16,42,67,.12)}
.searchrow{display:flex;gap:7px}
.searchrow input{
  flex:1;min-width:0;height:42px;border-radius:11px;border:1px solid var(--line);background:#f9fcff;
  padding:0 12px;font-size:14px;color:var(--ink);font-family:inherit;
}
.searchrow input:focus{outline:none;border-color:#a9cdf0;background:#fff;box-shadow:0 0 0 3px rgba(47,127,208,.12)}
.btn-search{
  height:42px;padding:0 15px;border-radius:11px;border:0;background:var(--ink-btn);color:#fff;
  font-size:13px;font-weight:750;cursor:pointer;flex:0 0 auto;
}
.q-group{margin-top:13px}
.q-title{font-size:11px;font-weight:800;color:#42566b;letter-spacing:.03em;margin-bottom:6px}
.q-chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  border:1px solid var(--line);background:#f8fbfe;border-radius:999px;padding:6px 11px;font-size:12px;
  font-weight:700;color:#3d5164;cursor:pointer;display:flex;align-items:center;gap:4px;
}
.chip:active{background:#eaf3ff}
.results{margin-top:6px}
.res{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:0;
  border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer;font-size:13.5px;
}
.res:active{background:#f6fafe}
.res .r-emoji{font-size:17px;flex:0 0 auto;width:24px;text-align:center}
.res .r-main{flex:1;min-width:0}
.res .r-name{display:block;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .r-sub{display:block;font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .r-add{font-size:16px;color:#2f7fd0;flex:0 0 auto}
.res.done{opacity:.55;cursor:default}
.res.done .r-add{font-size:11px;font-weight:700;color:var(--muted)}
.r-note{font-size:11px;color:var(--muted);padding:9px 2px}
#results .sec-title{margin-top:14px}

/* ===== トースト ===== */
.toast{
  position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,10px);
  background:rgba(22,40,60,.94);color:#fff;font-size:12.5px;font-weight:650;padding:9px 15px;border-radius:11px;
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:90;max-width:88vw;text-align:center;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hd-row">
      <h1><span class="sun">🌤</span>マイ天気</h1>
      <div class="hd-right">
        <span id="updated">読み込み中…</span>
        <button id="btnRefresh" class="icon-btn" aria-label="天気を更新">🔄</button>
      </div>
    </div>
    <div class="pills" id="pills" role="tablist" aria-label="地点の絞り込み">
      <button class="pill" data-filter="all" role="tab" aria-selected="true">すべて<span class="cnt" id="cntAll">0</span></button>
      <button class="pill" data-filter="life" role="tab" aria-selected="false">生活<span class="cnt" id="cntLife">0</span></button>
      <button class="pill" data-filter="work" role="tab" aria-selected="false">乗務範囲<span class="cnt" id="cntWork">0</span></button>
    </div>
  </header>

  <main>
    <div id="banner" class="banner" hidden></div>
    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" hidden></div>
    <p class="foot">データ: Open-Meteo ／ カードをタップで24時間・7日間</p>
  </main>

  <div class="bottombar">
    <button class="btn-add" id="btnAdd">＋ 場所を追加</button>
    <button class="btn-manage" id="btnManage" aria-label="地点の並び替え・削除">☰</button>
  </div>
</div>

<div class="overlay" id="overlay"></div>

<section class="sheet" id="detailSheet" aria-hidden="true" aria-label="地点の天気詳細" role="dialog">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="sh-title">
      <div class="ico" id="dEmoji">🏠</div>
      <div style="min-width:0">
        <div class="sh-name" id="dName">地点</div>
        <div class="sh-sub" id="dSub"></div>
      </div>
    </div>
    <button class="close" data-close aria-label="閉じる">✕</button>
  </div>
  <div class="sheet-body" id="dBody"></div>
</section>

<section class="sheet" id="manageSheet" aria-hidden="true" aria-label="地点の並び替えと削除" role="dialog">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="sh-title">
      <div class="ico">☰</div>
      <div style="min-width:0">
        <div class="sh-name">地点の並び替え・削除</div>
        <div class="sh-sub">生活／乗務範囲の切り替えもできます</div>
      </div>
    </div>
    <button class="close" data-close aria-label="閉じる">✕</button>
  </div>
  <div class="sheet-body" id="mBody"></div>
</section>

<section class="sheet" id="addSheet" aria-hidden="true" aria-label="場所を追加" role="dialog">
  <div class="grab"></div>
  <div class="sheet-head">
    <div class="sh-title">
      <div class="ico">＋</div>
      <div style="min-width:0">
        <div class="sh-name">場所を追加</div>
        <div class="sh-sub">駅名・市区町村・海外都市を検索</div>
      </div>
    </div>
    <button class="close" data-close aria-label="閉じる">✕</button>
  </div>
  <div class="sheet-body">
    <div class="addcat" id="addCat" role="group" aria-label="追加先カテゴリー">
      <button data-cat="life" class="on">生活に追加</button>
      <button data-cat="work">乗務範囲に追加</button>
    </div>
    <form class="searchrow" id="searchForm" autocomplete="off">
      <input id="searchInput" type="search" placeholder="例：三ノ宮、神戸市北区、Manila" aria-label="場所を検索" enterkeyhint="search">
      <button type="submit" class="btn-search">検索</button>
    </form>
    <div id="quick"></div>
    <div class="results" id="results"></div>
  </div>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

var APP_VERSION = '1.1.0';
var STORE_KEY = 'my_weather_v1';
var CACHE_KEY = 'my_weather_cache_v1';
var API = 'https://api.open-meteo.com/v1/forecast';
var GEO = 'https://geocoding-api.open-meteo.com/v1/search';

/* ---------- 初期地点 ---------- */
/* 自宅は特定されないよう、町名は出さず座標も代表地点（約1kmずらし）を使う */
var DEFAULT_VERSION = 2;   /* 既定地点の版。増やすときは下の migrateState に引き継ぎを書く */
var DEFAULT_PLACES = [
  {id:'home',     name:'自宅（北区）',        sub:'神戸市北区',          emoji:'🏠', cat:'life', lat:34.7700, lon:135.1800, home:true},
  {id:'tennoji',  name:'天王寺（勤務先）',    sub:'大阪市天王寺区',      emoji:'🏢', cat:'life', lat:34.6473, lon:135.5139},
  {id:'nishikujo',name:'西九条（プール）',    sub:'大阪市此花区',        emoji:'🏊', cat:'life', lat:34.6828, lon:135.4668},
  {id:'osaka',    name:'大阪・環状線',        sub:'大阪市北区',          emoji:'🏙️', cat:'work', lat:34.7025, lon:135.4959},
  {id:'otori',    name:'鳳（阪和線）',        sub:'堺市西区',            emoji:'🚉', cat:'work', lat:34.5342, lon:135.4488},
  {id:'kix',      name:'関西空港（連絡橋）',  sub:'泉佐野市 関空連絡橋', emoji:'✈️', cat:'work', lat:34.4347, lon:135.2440},
  {id:'wakayama', name:'和歌山（阪和線）',    sub:'和歌山市',            emoji:'🍊', cat:'work', lat:34.2323, lon:135.1916},
  {id:'kyoto',    name:'京都（JR京都線）',    sub:'京都市下京区',        emoji:'⛩️', cat:'work', lat:34.9858, lon:135.7588}
];

/* 以前の既定にあったが、乗務範囲から外した地点（id が既定のものだけ消す） */
var RETIRED_DEFAULTS = ['shirahama'];   /* v2: 南端は和歌山駅まで */

/* ---------- WMO 天気コード ---------- */
var WMO = {
  0:['☀️','快晴'], 1:['🌤️','晴れ'], 2:['⛅','晴れ時々曇り'], 3:['☁️','曇り'],
  45:['🌫️','霧'], 48:['🌫️','霧（着氷）'],
  51:['🌦️','弱い霧雨'], 53:['🌦️','霧雨'], 55:['🌧️','強い霧雨'],
  56:['🌧️','凍結霧雨'], 57:['🌧️','強い凍結霧雨'],
  61:['🌦️','弱い雨'], 63:['🌧️','雨'], 65:['🌧️','強い雨'],
  66:['🌧️','凍結雨'], 67:['🌧️','強い凍結雨'],
  71:['🌨️','弱い雪'], 73:['🌨️','雪'], 75:['❄️','強い雪'], 77:['🌨️','雪粒'],
  80:['🌦️','にわか雨'], 81:['🌧️','にわか雨'], 82:['🌧️','強いにわか雨'],
  85:['🌨️','にわか雪'], 86:['❄️','強いにわか雪'],
  95:['⛈️','雷雨'], 96:['⛈️','雷雨（ひょう）'], 99:['⛈️','激しい雷雨']
};
var RAIN_CODES = [51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99];
var SNOW_CODES = [71,73,75,77,85,86];
function weatherMeta(code){
  var v = WMO[code];
  return v ? {icon:v[0], label:v[1]} : {icon:'🌡️', label:'—'};
}
function isRainCode(code){ return RAIN_CODES.indexOf(code) >= 0 || SNOW_CODES.indexOf(code) >= 0; }

/* ---------- 状態 ---------- */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function loadState(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return null;
    var s = JSON.parse(raw);
    if(!s || !Array.isArray(s.places) || !s.places.length) return null;
    s.places = s.places.filter(function(p){ return p && typeof p.lat === 'number' && typeof p.lon === 'number'; });
    if(!s.places.length) return null;
    return s;
  }catch(e){ return null; }
}
var state = loadState() || { places: clone(DEFAULT_PLACES), addCat:'life' };
if(state.addCat !== 'work' && state.addCat !== 'life') state.addCat = 'life';
state.filter = 'all';

/* 保存済みの旧既定を、いまの既定に合わせる（端末に古い一覧が残っていても効く） */
function migrateState(s){
  if((s.dv || 1) >= DEFAULT_VERSION) return false;
  var homeDefault = null;
  DEFAULT_PLACES.forEach(function(p){ if(p.id === 'home') homeDefault = p; });
  s.dv = DEFAULT_VERSION;
  s.places.forEach(function(p){
    if(!p) return;
    /* 自宅：表記と座標をぼかした既定へ差し替え（並び順・カテゴリーはそのまま） */
    if(p.id === 'home' && homeDefault){
      p.name = homeDefault.name; p.sub = homeDefault.sub;
      p.lat = homeDefault.lat; p.lon = homeDefault.lon; p.home = true;
    }
  });
  /* 乗務範囲から外した既定地点（自分で追加した地点は id が違うので残る） */
  s.places = s.places.filter(function(p){ return p && RETIRED_DEFAULTS.indexOf(p.id) < 0; });
  if(!s.places.length) s.places = clone(DEFAULT_PLACES);
  return true;
}
if(migrateState(state)) saveState();

function saveState(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({places:state.places, addCat:state.addCat, dv:state.dv || DEFAULT_VERSION})); }catch(e){}
}

var placeData = {};            /* id -> 天気データ */
var lastUpdated = null;        /* Date */
var loadErr = null;
var loading = false;
var detailId = null;

function loadCache(){
  try{
    var raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return;
    var c = JSON.parse(raw);
    if(!c || !c.byId) return;
    var any = false;
    state.places.forEach(function(p){
      if(c.byId[p.id]){ placeData[p.id] = c.byId[p.id]; any = true; }
    });
    if(any && c.savedAt) lastUpdated = new Date(c.savedAt);
  }catch(e){}
}
function saveCache(){
  try{
    var byId = {};
    Object.keys(placeData).forEach(function(k){ byId[k] = placeData[k]; });
    localStorage.setItem(CACHE_KEY, JSON.stringify({savedAt: lastUpdated ? lastUpdated.toISOString() : null, byId:byId}));
  }catch(e){}
}

/* ---------- 取得 ---------- */
function urlFor(chunk){
  var lats = chunk.map(function(p){ return p.lat.toFixed(4); }).join(',');
  var lons = chunk.map(function(p){ return p.lon.toFixed(4); }).join(',');
  return API + '?latitude=' + lats + '&longitude=' + lons +
    '&current=temperature_2m,weather_code,wind_speed_10m,apparent_temperature,precipitation' +
    '&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,wind_speed_10m' +
    '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,wind_speed_10m_max,sunrise,sunset' +
    '&timezone=auto&forecast_days=7&wind_speed_unit=ms';
}

function normalize(d){
  if(!d || !d.current || !d.hourly || !d.daily) return null;
  return {
    tz: d.timezone || 'Asia/Tokyo',
    current: {
      time: d.current.time,
      temp: d.current.temperature_2m,
      code: d.current.weather_code,
      wind: d.current.wind_speed_10m,
      feels: d.current.apparent_temperature,
      precip: d.current.precipitation
    },
    hourly: d.hourly,
    daily: d.daily,
    fetchedAt: new Date().toISOString()
  };
}

var fetching = null;
function fetchAll(){
  if(fetching) return fetching;
  var places = state.places.slice();
  if(!places.length){ fetching = null; return Promise.resolve(); }
  loading = true; setRefreshing(true);

  var chunks = [];
  for(var i=0;i<places.length;i+=6) chunks.push(places.slice(i,i+6));

  fetching = Promise.all(chunks.map(function(chunk){
    return fetch(urlFor(chunk), {cache:'no-store'}).then(function(res){
      if(!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function(json){
      var arr = Array.isArray(json) ? json : [json];
      return chunk.map(function(p,idx){ return {p:p, d:arr[idx]}; });
    }).catch(function(err){
      /* 1地点ずつ取り直す（地点数が多い・1件が不正な場合の保険） */
      return Promise.all(chunk.map(function(p){
        var one = urlFor([p]);
        return fetch(one, {cache:'no-store'}).then(function(r){
          if(!r.ok) throw new Error('HTTP ' + r.status);
          return r.json();
        }).then(function(j){
          var o = Array.isArray(j) ? j[0] : j;
          return {p:p, d:o};
        }).catch(function(e2){ return {p:p, d:null, err:e2}; });
      }));
    });
  })).then(function(groups){
    var ok = 0, failed = 0;
    groups.forEach(function(g){
      g.forEach(function(item){
        var nd = normalize(item.d);
        if(nd){ placeData[item.p.id] = nd; ok++; }
        else failed++;
      });
    });
    if(ok > 0){
      lastUpdated = new Date();
      loadErr = failed ? ('一部の地点を取得できませんでした（' + failed + '件）') : null;
      saveCache();
    }else{
      loadErr = '天気を取得できませんでした';
    }
    loading = false; fetching = null;
    setRefreshing(false);
    render();
    if(detailId) renderDetail(detailId, true);
    return ok;
  }).catch(function(err){
    loadErr = '通信エラー: ' + (err && err.message ? err.message : '不明');
    loading = false; fetching = null;
    setRefreshing(false);
    render();
    return 0;
  });
  return fetching;
}

/* ---------- 時間軸の切り出し ---------- */
function hourStartIndex(d){
  if(!d || !d.hourly || !d.hourly.time || !d.hourly.time.length) return 0;
  var cur = (d.current && d.current.time) || d.hourly.time[0];
  var key = String(cur).slice(0,13);
  for(var i=0;i<d.hourly.time.length;i++){
    if(String(d.hourly.time[i]).slice(0,13) === key) return i;
  }
  return 0;
}
function nextHours(d, count){
  if(!d || !d.hourly) return [];
  var start = hourStartIndex(d), h = d.hourly, out = [];
  for(var k=0;k<count;k++){
    var i = start + k;
    if(i >= h.time.length) break;
    out.push({
      time: h.time[i],
      temp: h.temperature_2m ? h.temperature_2m[i] : null,
      pop: h.precipitation_probability ? h.precipitation_probability[i] : null,
      precip: h.precipitation ? h.precipitation[i] : null,
      code: h.weather_code ? h.weather_code[i] : 0,
      wind: h.wind_speed_10m ? h.wind_speed_10m[i] : null,
      isNow: k === 0
    });
  }
  return out;
}

/* ---------- 判断（傘・強風・自転車） ---------- */
function analyze(id){
  var d = placeData[id];
  if(!d) return null;
  var h = nextHours(d, 24);
  var next12 = h.slice(0,12);
  var nowRain = isRainCode(d.current.code) || (d.current.precip || 0) > 0.05;
  var pop12 = next12.length ? Math.max.apply(null, next12.map(function(x){ return x.pop || 0; })) : 0;
  var wet6 = h.slice(0,6).reduce(function(s,x){ return s + (x.precip || 0); }, 0);
  var umbrella = nowRain || pop12 >= 50 || wet6 >= 0.5;
  var windNext = next12.length ? Math.max.apply(null, next12.map(function(x){ return x.wind || 0; })) : 0;
  if(!next12.length && d.daily && d.daily.wind_speed_10m_max) windNext = d.daily.wind_speed_10m_max[0] || 0;
  return {
    umbrella: umbrella,
    nowRain: nowRain,
    pop12: Math.round(pop12),
    wet6: Math.round(wet6*10)/10,
    windNext: Math.round(windNext*10)/10,
    windNow: Math.round((d.current.wind||0)*10)/10,
    strong: windNext >= 10,
    windy: windNext >= 7 && windNext < 10
  };
}
function homeBadge(a){
  if(!a) return '';
  if(a.umbrella) return '<span class="badge walk">' + em('🚶') + ' 徒歩27分目安</span>';
  return '<span class="badge bike">' + em('🚲') + ' 自転車OK</span>';
}

/* ---------- 表示ユーティリティ ---------- */
function em(ch){ return '<span class="emoji">' + ch + '</span>'; }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function round(v){ return (v == null || isNaN(v)) ? null : Math.round(v); }
function tempClass(t){ if(t==null) return ''; if(t<3) return 'cold'; if(t<12) return 'cool'; if(t<22) return 'mild'; if(t<30) return 'warm'; return 'hot'; }
function pad2(n){ return (n<10?'0':'') + n; }
function hhmm(iso){
  if(!iso) return '—';
  var d = new Date(iso); if(isNaN(d.getTime())) return '—';
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}
function hourLabel(iso){ return String(iso).slice(11,13) + '時'; }
function dayDate(iso){ return String(iso).slice(5,7).replace(/^0/,'') + '/' + String(iso).slice(8,10); }
var WD = ['日','月','火','水','木','金','土'];
function dayLabel(iso, i){
  if(i === 0) return ['今日',''];
  if(i === 1) return ['明日',''];
  var dt = new Date(String(iso).slice(0,10) + 'T00:00:00');
  return [WD[dt.getDay()] + '曜', ''];
}

        sun +

  var tmp = state.places[i]; state.places[i] = state.places[j]; state.places[j] = tmp;
  saveState(); render(); renderManage();
}

  state.places = state.places.filter(function(x){ return x.id !== id; });
  delete placeData[id];
  saveState(); render(); renderManage(); saveCache();
  toast('「' + p.name + '」を削除しました');
}

  if(!window.confirm('初期地点（' + DEFAULT_PLACES.length + 'か所）に戻します。追加・削除した地点は消えます。よろしいですか？')) return;
  state.places = clone(DEFAULT_PLACES);

}

function searchLocal(q){
  var n = norm(q);
  if(!n) return [];
  var out = [];
  for(var i=0;i<LOCAL_DB.length;i++){
    var e = LOCAL_DB[i];
    if(norm(e.name).indexOf(n) >= 0 || norm(e.kana).indexOf(n) >= 0 ||
       norm(e.romaji).indexOf(n) >= 0 || norm(e.sub).indexOf(n) >= 0){
      out.push(e);
      if(out.length >= 10) break;
    }
  }
  return out;
}

function isAdded(name, lat, lon){
  return state.places.some(function(p){
    return p.name === name || (Math.abs(p.lat - lat) < 0.02 && Math.abs(p.lon - lon) < 0.02);
  });
}

var QUICK = ['三ノ宮','神戸','大阪','新大阪','天王寺','姫路','京都','奈良','関西空港','谷上','明石','和歌山','白浜','マニラ','東京','福岡','札幌'];

function renderQuick(){
  var close = QUICK.map(function(name){
    var e = LOCAL_DB.filter(function(x){ return x.name === name; })[0];
    if(!e) return '';
    return '<button class="chip" data-q="' + esc(name) + '">' + em(e.emoji) + ' ' + esc(name) + '</button>';
  }).join('');
  document.getElementById('quick').innerHTML =
    '<div class="q-group"><div class="q-title">よく使う駅・都市（タップで追加）</div><div class="q-chips">' + close + '</div></div>';
}

function resultRow(item, done){
  return '<button class="res' + (done ? ' done' : '') + '" data-name="' + esc(item.name) + '" data-lat="' + item.lat + '" data-lon="' + item.lon + '"' +
    (done ? ' disabled' : '') + '>' +
    '<span class="r-emoji">' + (item.emoji || '📍') + '</span>' +
    '<span class="r-main"><span class="r-name">' + esc(item.name) + '</span>' +
      '<span class="r-sub">' + esc(item.sub || '') + '</span></span>' +
    '<span class="r-add">' + (done ? '追加済み' : '＋') + '</span>' +
  '</button>';
}

function renderResults(localHits, geoHits, q){
  var html = '';
  if(localHits.length){
    html += '<div class="sec-title">検索結果</div>';
    html += localHits.map(function(e){
      return resultRow({name:e.name, sub:e.sub, lat:e.lat, lon:e.lon, emoji:e.emoji}, isAdded(e.name, e.lat, e.lon));
    }).join('');
  }
  if(geoHits.length){
    html += '<div class="sec-title">' + (localHits.length ? 'その他の候補' : '検索結果') + '</div>';
    html += geoHits.map(function(g){
      var sub = [g.admin1, g.country].filter(Boolean).join('・');
      return resultRow({name:g.name, sub:sub, lat:g.latitude, lon:g.longitude, emoji:'📍'}, isAdded(g.name, g.latitude, g.longitude));
    }).join('');
  }
  if(!html){
    html = '<div class="r-note">「' + esc(q) + '」は見つかりませんでした。別の表記（例：Sannomiya）でも試せます。</div>';
  }
  document.getElementById('results').innerHTML = html;
}

var searchSeq = 0;
function doSearch(){
  var q = document.getElementById('searchInput').value.trim();
  if(!q) return;
  var localHits = searchLocal(q);
  renderResults(localHits, [], q);
  if(localHits.length >= 6) return;
  var seq = ++searchSeq;
  document.getElementById('results').insertAdjacentHTML('beforeend', '<div class="r-note" id="geoWait">ほかの候補を検索中…</div>');
  fetch(GEO + '?name=' + encodeURIComponent(q) + '&count=8&language=ja&format=json')
    .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      if(seq !== searchSeq) return;
      var hits = (j && j.results) ? j.results : [];
      renderResults(localHits, hits, q);
    })
    .catch(function(){
      if(seq !== searchSeq) return;
      var w = document.getElementById('geoWait');
      if(w) w.textContent = '地名検索サービスに接続できませんでした（内蔵の候補は使えます）';
    });
}

function addPlace(obj){
  if(isAdded(obj.name, obj.lat, obj.lon)){ toast('すでに追加されています'); return null; }
  var p = {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2,5),
    name: obj.name,
    sub: obj.sub || '',
    emoji: obj.emoji || '📍',
    cat: state.addCat,
    lat: +obj.lat,
    lon: +obj.lon,
    home: false
  };
  state.places.push(p);
  saveState();
  render();
  closeSheets();
  toast('「' + p.name + '」を' + (p.cat === 'work' ? '乗務範囲' : '生活') + 'に追加しました');
  fetchAll();
  return p;
}

/* ---------- トースト ---------- */
var toastTimer = null;
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2300);
}

/* ---------- イベント ---------- */
function bind(){
  document.getElementById('btnRefresh').addEventListener('click', function(){ fetchAll(); });

  document.getElementById('pills').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.pill') : null;
    if(!b) return;
    state.filter = b.getAttribute('data-filter');
    render();
  });

  document.getElementById('btnAdd').addEventListener('click', function(){
    renderQuick();
    document.getElementById('results').innerHTML = '';
    document.getElementById('searchInput').value = '';
    syncAddCat();
    openSheet('addSheet');
  });

  document.getElementById('btnManage').addEventListener('click', function(){
    renderManage();
    openSheet('manageSheet');
  });

  document.getElementById('overlay').addEventListener('click', closeSheets);
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function(b){
    b.addEventListener('click', closeSheets);
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeSheets();
  });

  /* カードタップ */
  document.getElementById('list').addEventListener('click', function(e){
    var card = e.target.closest ? e.target.closest('.card') : null;
    if(!card) return;
    openDetail(card.getAttribute('data-id'));
  });
  document.getElementById('list').addEventListener('keydown', function(e){
    if(e.key !== 'Enter' && e.key !== ' ') return;
    var card = e.target.closest ? e.target.closest('.card') : null;
    if(!card) return;
    e.preventDefault();
    openDetail(card.getAttribute('data-id'));
  });

  /* 並び替えシート */
  document.getElementById('mBody').addEventListener('click', function(e){
    if(e.target && e.target.id === 'btnReset'){ resetPlaces(); return; }
    var btn = e.target.closest ? e.target.closest('button[data-act]') : null;
    if(!btn) return;
    var row = btn.closest('.mrow');
    if(!row) return;
    var id = row.getAttribute('data-id');
    var act = btn.getAttribute('data-act');
    if(act === 'up') movePlace(id, -1);
    else if(act === 'down') movePlace(id, 1);
    else if(act === 'del') removePlace(id);
    else if(act === 'cat'){
      var p = state.places.filter(function(x){ return x.id === id; })[0];
      if(!p) return;
      p.cat = btn.getAttribute('data-cat');
      saveState(); render(); renderManage();
    }
  });

  /* 追加先カテゴリー */
  document.getElementById('addCat').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-cat]') : null;
    if(!b) return;
    state.addCat = b.getAttribute('data-cat');
    saveState(); syncAddCat();
  });

  document.getElementById('searchForm').addEventListener('submit', function(e){
    e.preventDefault();
    doSearch();
  });

  document.getElementById('quick').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.chip') : null;
    if(!b) return;
    var name = b.getAttribute('data-q');
    var item = LOCAL_DB.filter(function(x){ return x.name === name; })[0];
    if(item) addPlace({name:item.name, sub:item.sub, lat:item.lat, lon:item.lon, emoji:item.emoji});
  });

  document.getElementById('results').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('.res') : null;
    if(!b || b.disabled) return;
    addPlace({
      name: b.getAttribute('data-name'),
      sub: (b.querySelector('.r-sub') || {}).textContent || '',
      lat: parseFloat(b.getAttribute('data-lat')),
      lon: parseFloat(b.getAttribute('data-lon')),
      emoji: (b.querySelector('.r-emoji') || {}).textContent || '📍'
    });
  });

  /* 復帰時に10分以上経過していれば更新 */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible' && lastUpdated && (Date.now() - lastUpdated.getTime() > 10*60*1000)) fetchAll();
  });
}

function syncAddCat(){
  Array.prototype.forEach.call(document.querySelectorAll('#addCat button'), function(b){
    if(b.getAttribute('data-cat') === state.addCat) b.classList.add('on'); else b.classList.remove('on');
  });
}

/* ---------- 起動 ---------- */
loadCache();
bind();
render();
fetchAll();

/* テスト用フック */
window.__mw = {
  APP_VERSION: APP_VERSION,
  state: state,
  placeData: placeData,
  DEFAULT_PLACES: DEFAULT_PLACES,
  LOCAL_DB: LOCAL_DB,
  weatherMeta: weatherMeta,
  analyze: analyze,
  nextHours: nextHours,
  hourStartIndex: hourStartIndex,
  normalize: normalize,
  render: render,
  fetchAll: fetchAll,
  addPlace: addPlace,
  removePlace: removePlace,
  movePlace: movePlace,
  openDetail: openDetail,
  searchLocal: searchLocal,
  norm: norm,
  saveState: saveState,
  getLastUpdated: function(){ return lastUpdated; },
  setFilter: function(f){ state.filter = f; render(); }
};
})();
